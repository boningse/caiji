version: '3.8'

services:
  kongzhi-app:
    build: .
    container_name: kongzhi-app
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - PORT=3000
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-kongzhi}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - ENVIRONMENT_MONITOR_ENCRYPTION_KEY=${ENVIRONMENT_MONITOR_ENCRYPTION_KEY:-}
      - MQTT_BROKER=${MQTT_BROKER:-mqtt://223.80.108.95:15007}
      - MQTT_USERNAME=${MQTT_USERNAME:-boning}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-BoNing@123}
    depends_on:
      - db
    network_mode: "host"

  db:
    image: timescale/timescaledb:2.15.1-pg16
    container_name: pg-kongzhi
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-kongzhi}
    ports:
      - "5432:5432"
    volumes:
      - /mnt/data1/pg-kongzhi-live:/var/lib/postgresql/data:Z
